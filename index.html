<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chain Memo — 문장 누적 암기</title>
<meta name="description" content="시험 문장을 장면 단위 체인으로 묶어, 처음부터 다시 쓰며 한 줄씩 누적해 외우는 학습 앱">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧱</text></svg>">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#23211c;--sub:#59544a;--line:#d8d2c2;--acc:#285f44;--acc2:#e8f2ec;--warn:#9c4522;--warnbg:#fbeee7;--ok:#285f44;--focus:#1f6f43;--radius:16px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;line-height:1.5}
button,input{touch-action:manipulation}
:focus{outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.card:focus-visible,.chip:focus-visible,.tbtn:focus-visible,button.btn:focus-visible,.modebar button:focus-visible,.backbtn:focus-visible,.stuckentry:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(64px + env(safe-area-inset-bottom,0px))}
header{padding:22px 4px 10px}
h1{font-size:26px;letter-spacing:-.4px}
h1 .brick{margin-right:6px}
.tagline{color:var(--sub);font-size:14px;margin-top:4px;line-height:1.5}
.filters{position:sticky;top:0;background:var(--bg);padding:10px 0 8px;z-index:5}
.frow{display:flex;gap:6px;overflow-x:auto;padding:3px 1px;scrollbar-width:none}
.frow::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:10px 14px;font-size:13.5px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.flabel{font-size:11.5px;color:var(--sub);margin:6px 2px 0;letter-spacing:.4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:10px 0;cursor:pointer;width:100%;text-align:left;font:inherit;display:block}
.card:active{transform:scale(.995)}
.card h3{font-size:17px;margin:6px 0 4px}
.badges{display:flex;gap:5px;flex-wrap:wrap}
.badge{font-size:11.5px;background:var(--acc2);color:var(--acc);border-radius:6px;padding:2.5px 7px;font-weight:600}
.badge.gray{background:#f0ede4;color:var(--sub)}
.scene{color:var(--sub);font-size:13.5px;line-height:1.55}
.prog{margin-top:10px}
.progbar{height:7px;background:#efead d;border-radius:99px;background:#efeadf;overflow:hidden}
.progbar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.progtext{font-size:12.5px;color:var(--sub);margin-top:5px}
.hidden{display:none!important}
button.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-size:15.5px;font-weight:600;cursor:pointer;min-height:48px}
button.btn.sub2{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.btn:disabled{opacity:.45}
.backbtn{background:none;border:0;font-size:15px;color:var(--acc);cursor:pointer;padding:12px 8px;font-weight:600;min-height:44px;display:inline-flex;align-items:center}
.modebar{display:flex;gap:8px;margin:12px 0}
.modebar button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px;font-size:15px;cursor:pointer;min-height:48px;font-weight:600;color:var(--sub)}
.modebar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.line{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin:8px 0}
.line .no{font-size:11.5px;color:var(--acc);font-weight:700;letter-spacing:.5px}
.line .txt{font-size:16.5px;line-height:1.55;margin-top:3px}
.line .ko{font-size:14px;color:var(--sub);line-height:1.55;margin-top:4px}
.line .tools{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.tbtn{border:1px solid var(--line);background:#fbfaf6;border-radius:9px;padding:10px 12px;font-size:13.5px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.qrow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin:8px 0}
.qrow .ko{font-size:14.5px;color:var(--ink);line-height:1.5}
.qrow .hintline{font-size:12.5px;color:var(--sub);margin-top:3px}
.qrow input{width:100%;margin-top:9px;border:1px solid var(--line);border-radius:10px;padding:12px 12px;font-size:16px;font:inherit;background:#fcfbf7;min-height:48px}
.qrow input:focus{outline:3px solid var(--focus);outline-offset:1px;border-color:transparent}
.qrow.good{border-color:var(--acc);background:var(--acc2)}
.qrow.bad{border-color:var(--warn);background:var(--warnbg)}
.qrow.almost{border-color:#c9a227;background:#fff8e1}
.qrow .verdict{font-size:13px;margin-top:7px;font-weight:600}
.qrow.good .verdict{color:var(--ok)}
.qrow.bad .verdict{color:var(--warn)}
.qrow.almost .verdict{color:#8a6d00}
.qrow .answer{font-size:14.5px;margin-top:5px;line-height:1.5}
.qactions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.stagebar{display:flex;align-items:center;gap:10px;margin:14px 0 4px}
.stagebar .st{font-weight:700;font-size:15.5px}
.stagebar .progbar{flex:1}
.notice{background:#fff8e8;border:1px solid #eadfae;border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.6;color:#5c5322;margin:10px 0}
.promptbox{background:#eef4ff;border:1px solid #c3d4f5;border-radius:12px;padding:12px 14px;margin:10px 0;font-size:14px;line-height:1.65;color:#22335c}
.promptbox .plabel{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;background:#33519b;color:#fff;border-radius:6px;padding:2px 7px;margin-bottom:6px}
.promptbox p{margin:0}
footer{color:var(--sub);font-size:12.5px;text-align:center;padding:26px 0 6px;line-height:1.7}
.empty{color:var(--sub);text-align:center;padding:38px 0;font-size:15px}
.summary{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:12px 0 2px}
.summary .srow{display:flex;align-items:center;gap:10px}
.summary .st{font-weight:700;font-size:15px;white-space:nowrap}
.summary .progbar{flex:1}
.summary .sdetail{font-size:12.5px;color:var(--sub);margin-top:6px;line-height:1.6}
.todaybtn{width:100%;margin-top:12px}
.stuckentry{width:100%;margin:10px 0 2px;background:var(--warnbg);border:1px solid #f0d5c6;color:var(--ink);border-radius:var(--radius);padding:14px 16px;text-align:left;font:inherit;cursor:pointer;display:block}
.stuckentry b{color:var(--warn)}
.stuckentry .sdetail{font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.55}
.stuckcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin:8px 0}
.stuckcard.good{border-color:var(--acc);background:var(--acc2)}
.stuckcard.bad{border-color:var(--warn);background:var(--warnbg)}
.stuckcard.almost{border-color:#c9a227;background:#fff8e1}
.stuckcard.almost .verdict{color:#8a6d00}
.stuckcard .meta{font-size:12px;color:var(--sub);line-height:1.5}
.stuckcard .ko{font-size:14.5px;line-height:1.5;margin-top:4px}
.stuckcard input{width:100%;margin-top:9px;border:1px solid var(--line);border-radius:10px;padding:12px 12px;font-size:16px;font:inherit;background:#fcfbf7;min-height:48px}
.stuckcard input:focus{outline:3px solid var(--focus);outline-offset:1px;border-color:transparent}
.stuckcard .verdict{font-size:13px;margin-top:7px;font-weight:600}
.stuckcard.good .verdict{color:var(--ok)}
.stuckcard.bad .verdict{color:var(--warn)}
.stuckcard .answer{font-size:14.5px;margin-top:5px;line-height:1.5}
.stuckcard .hintline{font-size:12.5px;color:var(--sub);margin-top:3px}
.ttsbar{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:12px 0 2px}
.ttsbar .trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ttsbar .tlabel{font-weight:700;font-size:14px;white-space:nowrap}
.ttsbar .trow .chip{min-height:44px;padding:9px 14px}
.ttsbar .vstatus{font-size:12.5px;color:var(--sub);margin-top:7px;line-height:1.55}
.ttsnotice{display:flex;gap:10px;align-items:flex-start;background:#fff8e8;border:1px solid #eadfae;border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.6;color:#5c5322;margin:10px 0}
.ttsnotice p{flex:1}
.ttsnotice button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:9px;min-width:44px;min-height:44px;padding:10px 12px;font-size:13px;cursor:pointer}
.stuckentry{min-height:44px}
.qrow.almost .verdict,.stuckcard.almost .verdict{color:#6f5500}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .card:active{transform:none}
}
@media (prefers-contrast:more){
  :root{--sub:#3f3b33;--line:#8a8474;--acc:#1e4d33;--warn:#7a3312}
  .badge,.badge.gray{border:1px solid currentColor}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="brick">🧱</span>Chain Memo</h1>
    <p class="tagline">문장을 한 줄씩 쌓아 올리는 누적 암기. 매번 처음부터 다시 쓰니까, 복습은 자동으로 따라옵니다.</p>
    <div class="ttsbar" id="ttsBar">
      <div class="trow"><span class="tlabel">🔊 발음 속도</span><span id="ttsRates" style="display:flex;gap:6px;flex-wrap:wrap"></span></div>
      <p class="vstatus" id="ttsVoiceStatus" aria-live="polite"></p>
    </div>
    <div class="ttsnotice hidden" id="ttsNotice" role="status"><p id="ttsNoticeText"></p><button id="ttsNoticeClose" aria-label="안내 닫기">닫기</button></div>
  </header>

  <main id="homeView">
    <div id="homeSummary"></div>
    <div id="stuckEntry"></div>
    <div class="filters">
      <div class="flabel">언어</div>
      <div class="frow" id="fLang"></div>
      <div class="flabel">시험</div>
      <div class="frow" id="fExam"></div>
      <div class="flabel">영역</div>
      <div class="frow" id="fArea"></div>
    </div>
    <div id="chainList"></div>
  </main>

  <main id="chainView" class="hidden">
    <button class="backbtn" id="backBtn">← 체인 목록</button>
    <div id="chainHead"></div>
    <div class="modebar">
      <button id="modeRead">📖 전체 보기</button>
      <button id="modeTrain">✍️ 누적 학습</button>
    </div>
    <section id="readPane"></section>
    <section id="trainPane" class="hidden"></section>
  </main>

  <main id="stuckView" class="hidden">
    <button class="backbtn" id="stuckBackBtn">← 체인 목록</button>
    <h1 style="font-size:22px;margin-top:4px">막힌 줄 모아보기</h1>
    <p class="tagline">전 체인에서 막혔던 줄만 모았습니다. 뜻만 보고 다시 써서 맞히면(정답을 보지 않고) 그 줄은 막힌 줄에서 빠집니다.</p>
    <section id="stuckList"></section>
  </main>

  <footer>Chain Memo <span id="ver"></span> · 콘텐츠는 각 시험의 형식에 맞게 자체 제작되었습니다</footer>
</div>

function b64decode(s){const bin=atob(s);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes);}
const CHAINS = CHAIN_B64.map(s=>JSON.parse(b64decode(s)));
const LS_KEY = "chainmemo-v1";
let store = {prog:{}};
try{const raw=localStorage.getItem(LS_KEY); if(raw){const p=JSON.parse(raw); if(p&&p.prog) store=p;}}catch(e){}
function save(){try{localStorage.setItem(LS_KEY, JSON.stringify(store));}catch(e){}}
function prog(id){ if(!store.prog[id]) store.prog[id]={unlocked:0,stuck:{},clean:0}; return store.prog[id]; }
if(!store.settings||typeof store.settings!=="object") store.settings={};

const LANGS=[["all","전체"],["en","English"],["fr","Français"]];
const EXAMS=[["all","전체"],["IELTS","IELTS"],["TEF","TEF"],["OPIc","OPIc"]];
const AREAS=[["all","전체"],["Speaking","Speaking"],["Writing","Writing"],["Listening","Listening"],["Reading","Reading"]];
const LANG_LABEL={en:"English",fr:"Français"};
let filt={lang:"all",exam:"all",area:"all"};
let cur=null, curMode="read";

const $=sel=>document.querySelector(sel);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function buildChips(elId, items, key){
  const el=$(elId); el.innerHTML="";
  items.forEach(([v,label])=>{
    const b=document.createElement("button");
    b.type="button";
    b.className="chip"+(filt[key]===v?" on":""); b.textContent=label;
    b.setAttribute("aria-pressed", filt[key]===v?"true":"false");
    b.addEventListener("click",()=>{filt[key]=v; renderFilters(); renderList();});
    el.appendChild(b);
  });
}
function renderFilters(){ buildChips("#fLang",LANGS,"lang"); buildChips("#fExam",EXAMS,"exam"); buildChips("#fArea",AREAS,"area"); }

function renderSummary(){
  const el=$("#homeSummary"); if(!el) return;
  let totalLines=0, opened=0, doneChains=0, startedChains=0, stuckLines=0;
  CHAINS.forEach(c=>{
    const p=prog(c.id); totalLines+=c.lines.length; opened+=p.unlocked;
    if(p.unlocked>0) startedChains++;
    if(p.unlocked>=c.lines.length) doneChains++;
    stuckLines+=Object.keys(p.stuck).length;
  });
  const pct=totalLines?Math.round(opened/totalLines*100):0;
  el.innerHTML=`<div class="summary"><div class="srow"><span class="st">전체 진도</span><div class="progbar"><i style="width:${pct}%"></i></div><span class="progtext" style="margin-top:0">${opened}/${totalLines}줄</span></div>
  <p class="sdetail">완성한 체인 ${doneChains}개 · 시작한 체인 ${startedChains}/${CHAINS.length}개 · 막힌 줄 ${stuckLines}개</p></div>`;
}

function renderList(){
  renderSummary(); renderStuckEntry();
  const list=$("#chainList"); list.innerHTML="";
  const items=CHAINS.filter(c=>(filt.lang==="all"||c.lang===filt.lang)&&(filt.exam==="all"||c.exam===filt.exam)&&(filt.area==="all"||c.area===filt.area));
  if(!items.length){ list.innerHTML='<p class="empty">해당하는 체인이 아직 없어요.</p>'; return; }
  items.forEach(c=>{
    const p=prog(c.id); const total=c.lines.length;
    const pct=total?Math.round(p.unlocked/total*100):0;
    const card=document.createElement("button"); card.className="card";
    card.innerHTML=`<div class="badges"><span class="badge">${esc(LANG_LABEL[c.lang]||c.lang)}</span><span class="badge">${esc(c.exam)}</span><span class="badge gray">${esc(c.area)}</span><span class="badge gray">${esc(c.level||"")}</span></div>
    <h3>${esc(c.title)}</h3><p class="scene">${esc(c.scene)}</p>
    <div class="prog"><div class="progbar"><i style="width:${pct}%"></i></div><p class="progtext">${p.unlocked}/${total}줄 열림 · 막힌 줄 ${Object.keys(p.stuck).length}개</p></div>`;
    card.addEventListener("click",()=>openChain(c.id));
    list.appendChild(card);
  });
}

/* 발음(기기 TTS) 보완: 속도 3단계(설정에 저장) · 언어별 음성 자동 선택 · 음성 없을 때 안내
   pickVoiceFromList / ttsLangTag / clampRate 는 순수 함수로 테스트한다. */
const TTS_RATES=[
  {id:"slow", label:"느리게", rate:0.75},
  {id:"normal", label:"보통", rate:0.92},
  {id:"fast", label:"빠르게", rate:1.05}
];
const TTS_DEFAULT_RATE=0.92;
function ttsLangTag(lang){ return lang==="fr" ? "fr-FR" : "en-US"; }
function ttsLangPrefix(lang){ return lang==="fr" ? "fr" : "en"; }
function clampRate(r){
  const n=Number(r);
  const hit=TTS_RATES.find(x=>x.rate===n);
  return hit?hit.rate:TTS_DEFAULT_RATE;
}
function getTtsRate(){ return clampRate(store.settings?store.settings.ttsRate:undefined); }
function setTtsRate(r){ if(!store.settings) store.settings={}; store.settings.ttsRate=clampRate(r); save(); }
/* voices: [{lang, name, default, localService}] — 정확한 로케일 > 같은 언어 > 없음(null) 순 */
function pickVoiceFromList(voices, lang){
  if(!Array.isArray(voices)||!voices.length) return null;
  const tag=ttsLangTag(lang).toLowerCase(), prefix=ttsLangPrefix(lang);
  const norm=v=>String((v&&v.lang)||"").toLowerCase().replace("_","-");
  let hit=voices.find(v=>norm(v)===tag);
  if(hit) return hit;
  hit=voices.find(v=>norm(v).startsWith(prefix+"-")||norm(v)===prefix);
  return hit||null;
}
function voiceStatusFromList(voices){
  return {en: !!pickVoiceFromList(voices,"en"), fr: !!pickVoiceFromList(voices,"fr")};
}
let ttsVoices=[];
let ttsNoticed={};
function refreshTtsVoices(){
  try{
    if(!("speechSynthesis" in window)) return;
    const vs=speechSynthesis.getVoices();
    if(vs&&vs.length) ttsVoices=vs;
  }catch(e){}
  renderTtsStatus();
}
function currentVoices(){
  if(ttsVoices.length) return ttsVoices;
  try{
    if("speechSynthesis" in window){
      const vs=speechSynthesis.getVoices();
      if(vs&&vs.length) ttsVoices=vs;
    }
  }catch(e){}
  return ttsVoices;
}
function pickVoice(lang){ return pickVoiceFromList(currentVoices(), lang); }
function showTtsNotice(msg){
  const el=document.querySelector("#ttsNotice"); if(!el) return;
  const tx=document.querySelector("#ttsNoticeText"); if(tx) tx.textContent=msg;
  el.classList.remove("hidden");
}
function hideTtsNotice(){ const el=document.querySelector("#ttsNotice"); if(el) el.classList.add("hidden"); }
function noticeMissingVoice(lang){
  if(ttsNoticed[lang]) return; ttsNoticed[lang]=true;
  const name=lang==="fr"?"프랑스어":"영어";
  showTtsNotice(name+" 음성이 이 기기에 없어서 기본 음성으로 재생돼요. 발음이 어색할 수 있으니, 기기 설정의 '텍스트 음성 변환(TTS)'에서 "+name+" 음성을 추가하면 훨씬 정확해집니다.");
}
function renderTtsStatus(){
  const el=document.querySelector("#ttsVoiceStatus"); if(!el) return;
  if(!("speechSynthesis" in window)){ el.textContent="이 브라우저는 음성 재생을 지원하지 않아요."; return; }
  const vs=ttsVoices;
  if(!vs.length){ el.textContent="기기 음성 목록을 불러오는 중이에요. 듣기를 눌러보세요."; return; }
  const st=voiceStatusFromList(vs);
  const parts=[];
  parts.push("영어 음성 "+(st.en?"있음":"없음(기본 음성으로 재생)"));
  parts.push("프랑스어 음성 "+(st.fr?"있음":"없음(기본 음성으로 재생)"));
  el.textContent=parts.join(" · ");
}
function renderTtsBar(){
  const box=document.querySelector("#ttsRates"); if(!box) return;
  box.innerHTML="";
  const curRate=getTtsRate();
  TTS_RATES.forEach(o=>{
    const b=document.createElement("button");
    b.className="chip"+(curRate===o.rate?" on":"");
    b.textContent=o.label;
    b.setAttribute("aria-pressed", curRate===o.rate?"true":"false");
    b.addEventListener("click",()=>{ setTtsRate(o.rate); renderTtsBar(); });
    box.appendChild(b);
  });
  renderTtsStatus();
}
function speak(text, langCode){
  const lang=langCode||(cur?cur.lang:"en");
  if(!("speechSynthesis" in window)||typeof SpeechSynthesisUtterance==="undefined"){
    showTtsNotice("이 기기·브라우저에서는 음성 재생을 지원하지 않아요. 다른 브라우저에서 열어보거나, 문장을 눈으로 읽으며 연습해 주세요.");
    return;
  }
  try{
    const u=new SpeechSynthesisUtterance(text);
    u.lang=ttsLangTag(lang);
    u.rate=getTtsRate();
    const trySpeak=()=>{
      const v=pickVoice(lang);
      if(v){ u.voice=v; u.lang=v.lang||u.lang; }
      else if(currentVoices().length){ noticeMissingVoice(lang); }
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    };
    if(!currentVoices().length && speechSynthesis.getVoices){
      /* 음성 목록이 아직 비어 있으면 voiceschanged를 한 번 기다렸다가 재생 */
      let done=false;
      const go=()=>{ if(done) return; done=true; refreshTtsVoices(); trySpeak(); };
      try{ if(speechSynthesis.addEventListener) speechSynthesis.addEventListener("voiceschanged", go, {once:true}); }catch(e){}
      setTimeout(go, 350);
    }else{
      trySpeak();
    }
  }catch(e){
    showTtsNotice("음성 재생에 실패했어요. 기기 볼륨과 무음 모드를 확인해 주세요.");
  }
}

/*JUDGE_START*/
function normalize(s){
  return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim();
}
function rawTokens(s){
  const t=String(s||"").toLowerCase().replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim();
  return t?t.split(" "):[];
}
function normTokens(s){
  const t=normalize(s);
  return t?t.split(" "):[];
}
const ARTICLE_SET=new Set(["a","an","the","le","la","les","un","une","des","du","au","aux","l"]);
function lev(a,b){
  const m=a.length,n=b.length;
  if(Math.abs(m-n)>2) return 99;
  const dp=[];
  for(let i=0;i<=m;i++){ dp.push(new Array(n+1).fill(0)); dp[i][0]=i; }
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    dp[i][j]=Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  }
  return dp[m][n];
}
/* 3단계 판정: ok(정답) / almost(거의 맞음 — 형태 실수) / stuck(막힘)
   detail: ok+악센트 차이 {kind:'accent', accents:[{want,got}]}
           almost {kind:'spelling'|'article', pos(1-based, want 기준), word(want 원형 토큰)} */
function judge(wantRaw, gotRaw){
  const wantNorm=normalize(wantRaw), gotNorm=normalize(gotRaw);
  if(!gotNorm) return {tier:"stuck", detail:null};
  const wRaw=rawTokens(wantRaw), gRaw=rawTokens(gotRaw);
  if(wantNorm===gotNorm){
    const accents=[];
    if(wRaw.length===gRaw.length){
      for(let i=0;i<wRaw.length;i++){
        if(wRaw[i]!==gRaw[i] && normalize(wRaw[i])===normalize(gRaw[i])) accents.push({want:wRaw[i], got:gRaw[i]});
      }
    }
    if(accents.length) return {tier:"ok", detail:{kind:"accent", accents}};
    return {tier:"ok", detail:null};
  }
  const w=normTokens(wantRaw), g=normTokens(gotRaw);
  if(w.length===g.length){
    const diff=[];
    for(let i=0;i<w.length;i++) if(w[i]!==g[i]) diff.push(i);
    if(diff.length===1){
      const i=diff[0];
      if(ARTICLE_SET.has(w[i]) && ARTICLE_SET.has(g[i]))
        return {tier:"almost", detail:{kind:"article", pos:i+1, word:wRaw[i]||w[i]}};
      const limit=w[i].length>=7?2:1;
      if(lev(w[i],g[i])<=limit)
        return {tier:"almost", detail:{kind:"spelling", pos:i+1, word:wRaw[i]||w[i]}};
    }
    return {tier:"stuck", detail:null};
  }
  if(Math.abs(w.length-g.length)===1){
    const longerIsWant=w.length>g.length;
    const longer=longerIsWant?w:g, shorter=longerIsWant?g:w;
    for(let k=0;k<longer.length;k++){
      if(!ARTICLE_SET.has(longer[k])) continue;
      const rest=longer.slice(0,k).concat(longer.slice(k+1));
      if(rest.length===shorter.length && rest.every((t,j)=>t===shorter[j])){
        const word=longerIsWant?(wRaw[k]||longer[k]):longer[k];
        return {tier:"almost", detail:{kind:"article", pos:k+1, word}};
      }
    }
    return {tier:"stuck", detail:null};
  }
  return {tier:"stuck", detail:null};
}
function accentNote(res){
  if(res && res.tier==="ok" && res.detail && res.detail.kind==="accent")
    return " — 악센트만 확인: "+res.detail.accents.map(a=>a.want+" (입력: "+a.got+")").join(", ");
  return "";
}

function firstWord(t){ const m=String(t).trim().split(/\s+/); return m[0]||""; }

  pane.querySelectorAll("[data-reveal]").forEach(b=>b.addEventListener("click",()=>{
    const i=+b.dataset.reveal; trainState.revealed.add(i);
    $("#ans"+i).textContent=cur.lines[i].t;
  }));
  pane.querySelectorAll("[data-say]").forEach(b=>b.addEventListener("click",()=>speak(cur.lines[+b.dataset.say].t)));
  $("#againBtn").addEventListener("click",renderTrain);
  $("#checkBtn").addEventListener("click",checkTrain);
}
function checkTrain(){
  const p=prog(cur.id); const stage=trainState.stage; let allOk=true; let newlyStuck=0; let almostCount=0;
  for(let i=0;i<stage;i++){
    const res=judge(cur.lines[i].t, $("#in"+i).value);
    const row=$("#qr"+i), vd=$("#vd"+i), ans=$("#ans"+i);
    if(res.tier==="ok"){
      row.classList.add("good"); row.classList.remove("bad","almost"); vd.textContent="✓ 맞았어요"+accentNote(res);
      if(!trainState.revealed.has(i) && p.stuck[i]){ /* keep history */ }
    }else if(res.tier==="almost"){
      allOk=false; almostCount++;
      row.classList.add("almost"); row.classList.remove("good","bad");
      vd.textContent="거의 맞음 — "+res.detail.pos+"번째 단어 확인: "+res.detail.word+" · 그 자리만 고쳐 다시 써보세요.";
      ans.textContent="";
    }else{
      allOk=false; row.classList.add("bad"); row.classList.remove("good","almost");
      vd.textContent="✗ 막힌 줄로 기록했어요"; ans.textContent=cur.lines[i].t;
      if(!p.stuck[i]) newlyStuck++;
      p.stuck[i]=(p.stuck[i]||0)+1;
    }
  }
  const msg=$("#trainMsg");
  if(allOk){
    const wasUnlocked=p.unlocked;
    if(stage>p.unlocked) p.unlocked=stage;
    if(trainState.revealed.size===0) p.clean=(p.clean||0)+1;
    if(stage>=cur.lines.length){
      msg.textContent="🎉 체인 완성! 처음부터 끝까지 한 번에 이어 썼어요."; trainState.done=true;
    }else{
      msg.textContent=`✓ ${stage}줄 통과! 바로 이어서 새 줄이 하나 붙어요. 원하는 만큼 계속할 수 있어요.`;
    }
    save(); refreshHead();
    setTimeout(()=>{ if(trainState && cur) renderTrain(); }, 900);
  }else{
    msg.textContent=`${almostCount? "거의 맞은 줄 "+almostCount+"개 — 표시된 단어만 고치면 돼요. ":""}${newlyStuck? "새로 막힌 줄 "+newlyStuck+"개. ":""}틀린 줄을 보고 다시 써보세요.`;
    save();
  }
}
function refreshHead(){ if(cur) { const keep=cur.id; openChain(keep); $("#modeRead").classList.toggle("on",false); curMode="train"; $("#modeTrain").classList.add("on"); $("#readPane").classList.add("hidden"); $("#trainPane").classList.remove("hidden"); } }

document.addEventListener("DOMContentLoaded",()=>{
  $("#ver").textContent="v"+(window.__APP_VERSION__||"");
  renderTtsBar(); refreshTtsVoices();
  if("speechSynthesis" in window){ try{ speechSynthesis.addEventListener("voiceschanged", refreshTtsVoices); }catch(e){} }
  const nc=$("#ttsNoticeClose"); if(nc) nc.addEventListener("click", hideTtsNotice);
  renderFilters(); renderList();
  $("#backBtn").addEventListener("click",()=>{ $("#chainView").classList.add("hidden"); $("#homeView").classList.remove("hidden"); renderList(); window.scrollTo(0,0); });
  const sb=$("#stuckBackBtn"); if(sb) sb.addEventListener("click",()=>{ $("#stuckView").classList.add("hidden"); $("#homeView").classList.remove("hidden"); renderList(); window.scrollTo(0,0); });
  $("#modeRead").addEventListener("click",()=>{curMode="read"; renderMode();});
  $("#modeTrain").addEventListener("click",()=>{curMode="train"; renderMode();});
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
});

</script>
